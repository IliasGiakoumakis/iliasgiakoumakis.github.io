<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ilias Giakoumakis | Bio</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
            --text-main: #1f2937;
            --text-sub: #64748b;
            --primary: #2563eb;
            --shadow: rgba(0,0,0,0.05);
        }

        [data-theme="dark"] {
            --bg-body: #0f172a;
            --bg-card: #1e293b;
            --text-main: #f1f5f9;
            --text-sub: #94a3b8;
            --primary: #38bdf8;
            --shadow: rgba(0,0,0,0.3);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            transition: all 0.3s ease;
        }

        /* Toggle Button */
        .theme-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            background: var(--bg-card);
            border: 1px solid var(--text-sub);
            color: var(--text-main);
            padding: 10px;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 4px 6px var(--shadow);
        }

        .container {
            background: var(--bg-card);
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 10px 25px var(--shadow);
            max-width: 400px;
            width: 90%;
            text-align: center;
        }

        .profile-img {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            margin-bottom: 1.5rem;
            object-fit: cover;
            border: 4px solid var(--primary);
        }

        h1 { margin: 0.5rem 0; font-size: 1.6rem; }
        .subtitle { color: var(--text-sub); font-size: 0.9rem; margin-bottom: 1.5rem; }
        
        .social-links {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            margin-top: 1.5rem;
        }

        .social-links a {
            color: var(--text-main);
            font-size: 1.6rem;
            transition: 0.2s;
        }

        .social-links a:hover { color: var(--primary); }

        .btn-contact {
            display: inline-block;
            margin-top: 2rem;
            background: var(--primary);
            color: white;
            padding: 0.8rem 2rem;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <button class="theme-toggle" onclick="toggleTheme()">
        <i id="theme-icon" class="fas fa-moon"></i>
    </button>

    <div class="container">
        <img src="me.png" alt="Ilias" class="profile-img" onerror="this.src='https://ui-avatars.com/api/?name=Ilias+Giakoumakis&background=2563eb&color=fff'">
        
        <h1>Ilias Giakoumakis</h1>
        <p class="subtitle">Undergraduate CS Student @ UOC</p>
        
        <p>I'm an undergraduate student at the University of Crete, in the Computer Science Department (CSD).</p>

        <div class="social-links">
            <a href="https://github.com/IliasGiakoumakis" target="_blank"><i class="fab fa-github"></i></a>
            <a href="https://mail.google.com/mail/?view=cm&fs=1&to=iliasggiakoumakis@gmail.com" target="_blank">
                <i class="fas fa-envelope"></i>
            </a>
            <a href="https://www.linkedin.com/in/ilias-giakoumakis-106580397/" target="_blank"><i class="fab fa-linkedin"></i></a>
        </div>

        <a href="https://mail.google.com/mail/?view=cm&fs=1&to=iliasggiakoumakis@gmail.com" class="btn-contact" target="_blank">Send Message</a>
    </div>

    <script>
        function toggleTheme() {
            const body = document.body;
            const icon = document.getElementById('theme-icon');
            const currentTheme = body.getAttribute('data-theme');
            
            if (currentTheme === 'dark') {
                body.removeAttribute('data-theme');
                icon.classList.replace('fa-sun', 'fa-moon');
                localStorage.setItem('theme', 'light');
            } else {
                body.setAttribute('data-theme', 'dark');
                icon.classList.replace('fa-moon', 'fa-sun');
                localStorage.setItem('theme', 'dark');
            }
        }

        // Έλεγχος αν ο χρήστης είχε επιλέξει κάτι πριν
        if (localStorage.getItem('theme') === 'dark') {
            document.body.setAttribute('data-theme', 'dark');
            document.getElementById('theme-icon').classList.replace('fa-moon', 'fa-sun');
        }
    </script>
</body>
</html>
